<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Follow-Up Reminder</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background:#fff; color:#111; }
    .card { max-width: 780px; margin: 0 auto; border: 1px solid #e5e5e5; border-radius: 16px; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { margin: 0 0 18px; color:#333; }
    .bar { height: 6px; background:#009A44; border-radius: 999px; margin: 10px 0 18px; }
    label { display:block; font-weight: 700; margin: 14px 0 6px; }
    select, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; }
    button { background:#009A44; color:#fff; border: none; margin-top: 16px; cursor:pointer; font-weight: 700; }
    button:hover { filter: brightness(0.95); }
    .note { margin-top: 14px; font-size: 14px; color:#444; line-height: 1.35; }
    .phone { font-weight: 800; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a Follow-Up Reminder</h1>
    <p class="sub">Harold Schnitzer Diabetes and Adult Endocrinology Health Center</p>
    <div class="bar"></div>

    <label for="interval">Choose your follow-up plan:</label>
    <select id="interval">
      <option value="1m">1 month</option>
      <option value="3m">3 months</option>
      <option value="6m">6 months</option>
      <option value="1y">1 year</option>
    </select>

    <button id="addBtn">Add reminder to my calendar</button>

    <p class="note">
      This will create a calendar reminder to call and schedule your follow-up if it has not already been scheduled.
      <br/>
      Scheduling phone: <span class="phone">503-494-3273</span>
    </p>

    <p class="note" id="logicNote"></p>
  </div>

<script>
(function () {
  const clinicName = "Harold Schnitzer Diabetes and Adult Endocrinology Health Center";
  const phone = "503-494-3273";

  // Map follow-up interval -> months until reminder (3 months before follow-up)
  // For 1m and 3m follow-ups, "3 months before" becomes "today" (0 months).
  const reminderMonthsByInterval = {
    "1m": 0,   // reminder today
    "3m": 0,   // reminder today
    "6m": 3,   // 6 - 3
    "1y": 9    // 12 - 3
  };

  const intervalLabel = { "1m":"1 month", "3m":"3 months", "6m":"6 months", "1y":"1 year" };

  function addMonths(d, months) {
    // safe month add: JS will auto-roll dates; we anchor by setting date=1 then restore min day
    const day = d.getDate();
    const out = new Date(d);
    out.setDate(1);
    out.setMonth(out.getMonth() + months);
    const lastDay = new Date(out.getFullYear(), out.getMonth() + 1, 0).getDate();
    out.setDate(Math.min(day, lastDay));
    return out;
  }

  function fmtICSDate(dt) {
    // floating local time: YYYYMMDDTHHMMSS
    const pad = (n) => String(n).padStart(2, "0");
    return dt.getFullYear() +
      pad(dt.getMonth() + 1) +
      pad(dt.getDate()) + "T" +
      pad(dt.getHours()) +
      pad(dt.getMinutes()) +
      pad(dt.getSeconds());
  }

  function downloadICS(reminderDate, intervalKey) {
    // Event at 9:00 AM for 5 minutes
    const start = new Date(reminderDate);
    start.setHours(9, 0, 0, 0);
    const end = new Date(reminderDate);
    end.setHours(9, 5, 0, 0);

    const uid = (crypto?.randomUUID?.() || (Date.now() + "@ohsu"));
    const dtstamp = fmtICSDate(new Date());

    const summary = "Call to schedule your follow-up appointment";
    const description =
      `Please call ${clinicName} at ${phone} to schedule your follow-up appointment (if not already scheduled).`;

    const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//OHSU//Follow-Up Reminder//EN
CALSCALE:GREGORIAN
BEGIN:VEVENT
UID:${uid}
DTSTAMP:${dtstamp}
SUMMARY:${summary}
DESCRIPTION:${description}
DTSTART:${fmtICSDate(start)}
DTEND:${fmtICSDate(end)}
BEGIN:VALARM
TRIGGER:-PT0M
ACTION:DISPLAY
DESCRIPTION:Call ${clinicName} at ${phone} to schedule your follow-up.
END:VALARM
END:VEVENT
END:VCALENDAR`;

    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `followup-reminder-${intervalKey}.ics`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  const intervalEl = document.getElementById("interval");
  const btn = document.getElementById("addBtn");
  const note = document.getElementById("logicNote");

  function updateNote() {
    const key = intervalEl.value;
    const months = reminderMonthsByInterval[key];
    if (months === 0) {
      note.textContent = `For a ${intervalLabel[key]} follow-up, “3 months before” is today — this will set a reminder for today.`;
    } else {
      note.textContent = `This will set a reminder for ${months} month(s) from today (3 months before your ${intervalLabel[key]} follow-up).`;
    }
  }
  intervalEl.addEventListener("change", updateNote);
  updateNote();

  btn.addEventListener("click", () => {
    const key = intervalEl.value;
    const months = reminderMonthsByInterval[key];
    const today = new Date();
    const reminderDate = addMonths(today, months);
    downloadICS(reminderDate, key);
  });
})();
</script>
</body>
</html>
